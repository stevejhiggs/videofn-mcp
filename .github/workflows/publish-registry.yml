name: Publish to the MCP Registry

# The videoFn release (pnpm mcpb:publish in the app repository) attaches
# videoFn.mcpb to a GitHub release here, then commits server.json. That commit
# runs this workflow. It signs in with this workflow's GitHub OIDC token, so no
# registry credential is stored anywhere.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

# One publish at a time, so a manual run cannot race a push.
concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_REGISTRY: https://registry.modelcontextprotocol.io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The registry refuses a version it already has, so a re-run after a
      # successful publish stops here.
      - name: Check the registry for this version
        id: listed
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          echo "Publishing $name $version"
          if curl --fail --silent --show-error "$MCP_REGISTRY/v0.1/servers?search=$name" \
            | jq -e --arg name "$name" --arg version "$version" '.servers[] | select(.server.name == $name and .server.version == $version)' >/dev/null; then
            echo "The registry already lists $name $version."
            echo "listed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.listed.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.listed.outputs.listed != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher publish
